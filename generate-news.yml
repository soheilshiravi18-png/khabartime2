name: Generate News

on:
  schedule:
    # هر روز ساعت ۶ صبح به وقت ایران (۲:۳۰ UTC)
    - cron: '30 2 * * *'
  workflow_dispatch: {}  # امکان اجرای دستی از تب Actions

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai

      - name: Generate news
        env:
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
        run: python generate_news.py

      - name: Commit and push generated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news/
          git diff --staged --quiet || git commit -m "Add auto-generated news"
          git push
